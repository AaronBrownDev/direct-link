services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      ingress:
        condition: service_started
    devices:
      - /dev/video0:/dev/video0
    group_add:
      - "985"
      - video

  dev-gpu:
    extends: dev
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

  redis:
    image: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes # data persistence
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest
    dns: 127.0.0.11
    ports:
      - "7880:7880" # HTTP + WebSocket signaling
      - "7881:7881" # RTC (WebRTC) TCP fallback
      - "50200-50300:50200-50300/udp" # WebRTC UDP media
    volumes:
      - type: bind
        source: ../backend/configs/livekit.yaml
        target: /etc/livekit.yaml
    command: >
      sh -c 'exec livekit-server
        --config /etc/livekit.yaml
        --bind 0.0.0.0
        --node-ip $$(getent hosts livekit | awk "{ print $$1 }" | head -1)'
    depends_on:
      redis:
        condition: service_healthy

  ingress:
    image: livekit/ingress:latest
    network_mode: host
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=dev-secret-that-is-32-chars-long
      - LIVEKIT_WS_URL=ws://localhost:7880
      - INGRESS_CONFIG_FILE=/etc/ingress.yaml
    volumes:
      - ../backend/configs/ingress.yaml:/etc/ingress.yaml
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # needed to allow scraping metrics from network_mode host
    volumes:
      - ../backend/configs/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
    depends_on:
      - dev

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ../infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ../infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  redis-data:
    driver: local
  grafana-data:
    driver: local