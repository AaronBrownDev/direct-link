name: Video Core CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'video-core/**'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/video-core-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'video-core/**'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/video-core-ci.yml'

concurrency:
  group: video-core-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # Job 1: Build and run unit tests
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavdevice-dev \
            libgtest-dev

      - name: Build and run unit tests
        run: make test

  # Job 2: clang-format check
  format:
    name: Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/bin/clang-format

      - name: Check formatting
        run: make format-check

  # Job 3: clang-tidy lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y clang-tidy-18
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/bin/clang-tidy

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            cmake \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavdevice-dev

      - name: Generate compile_commands.json
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON .

      - name: Run clang-tidy
        run: make lint