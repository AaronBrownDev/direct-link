version: "2"

linters:
  default: standard
  enable:
    # Security
    - gosec

    # Bug prevention
    - bodyclose
    - contextcheck
    - errorlint
    - nilerr

    # Code quality
    - gocritic
    - goconst
    - revive
    - unconvert
    - unparam

    # Performance
    - prealloc

  exclusions:
    paths:
      - gen
    presets:
      - comments
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0