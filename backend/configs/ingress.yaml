log_level: debug

# Dev credentials — overridden by k8s overlay (patches/ingress-config.yaml) in cluster.
# livekit/ingress does not map LIVEKIT_API_KEY/LIVEKIT_API_SECRET env vars to these fields,
# so they must be set explicitly for docker-compose local dev.
api_key: "devkey"
api_secret: "dev-secret-that-is-32-chars-long"
ws_url: "ws://localhost:7880"

redis:
  address: localhost:6379

whip_port: 8080
rtmp_port: 1935

health_port: 8090
http_relay_port: 17932 # defaults to 9090 which conflicts with prometheus due to ingress requiring `network_mode: host` in docker. So set to obscure port to avoid conflicts.
prometheus_port: 9092