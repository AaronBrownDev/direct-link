port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50200
  port_range_end: 50300
prometheus:
  port: 9091
redis:
  address: localhost:6379
keys:
  devkey: dev-secret-that-is-32-chars-long
webhook:
  api_key: devkey
  urls:
    - http://localhost:8081/webhooks/livekit
ingress:
  whip_base_url: http://localhost:8080/whip
room:
  # Playout delay hint sent to subscribers via RTP header extension.
  # Caps libwebrtc's adaptive jitter buffer so it cannot grow past
  # max_delay regardless of observed packet jitter.
  playout_delay:
    enabled: true
    min_delay: 0
    max_delay: 200