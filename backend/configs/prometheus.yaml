global:
  scrape_interval: 15s      # How often Prometheus scrapes targets
  evaluation_interval: 15s  # How often rules are evaluated

scrape_configs:
  - job_name: "signaling-server"
    # The signaling server runs inside the 'dev' container
    # Docker Compose networking resolves service names
    static_configs:
      - targets: ["dev:8081"]
        labels:
          service: "signaling"
          environment: "dev"
    metrics_path: "/metrics"
    scrape_interval: 5s  # Scrape more frequently for development

  - job_name: "livekit-server"
    static_configs:
      - targets: ["livekit:9091"]
        labels:
          service: "livekit"
          environment: "dev"
    metrics_path: "/metrics"
    scrape_interval: 5s

  - job_name: "ingress-server"
    static_configs:
      - targets: ["host.docker.internal:9092"]
        labels:
          service: "ingress"
          environment: "dev"
    metrics_path: "/metrics"
    scrape_interval: 5s