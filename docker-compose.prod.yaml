# Production-like stack for testing the signaling server container image.
# Mirrors the deployment topology: signaling runs from its built image
# (not source-mounted), talking to Redis, LiveKit, and Ingress.
#
# All services use network_mode: host so WebRTC UDP (ports 50200-50300)
# reaches LiveKit without Docker NAT in the path. LiveKit advertises
# 127.0.0.1 as its ICE candidate, reachable from the host.
#
# Usage:
#   docker build -f backend/Dockerfile -t directlink/signaling:dev .
#   docker compose -f docker-compose.prod.yaml up
#   docker compose -f docker-compose.prod.yaml down

services:
  signaling:
    image: directlink/signaling:dev
    network_mode: host
    environment:
      - REDIS_ADDR=localhost:6379
      - LIVEKIT_HOST=http://localhost:7880
      - LIVEKIT_EXTERNAL_URL=ws://localhost:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=dev-secret-that-is-32-chars-long
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  redis:
    image: redis:7
    network_mode: host
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    volumes:
      - ./backend/configs/livekit.yaml:/etc/livekit.yaml
    command: >
      --config /etc/livekit.yaml
      --bind 0.0.0.0
      --node-ip 127.0.0.1
    stop_grace_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  ingress:
    image: livekit/ingress:latest
    network_mode: host
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=dev-secret-that-is-32-chars-long
      - LIVEKIT_WS_URL=ws://localhost:7880
      - INGRESS_CONFIG_FILE=/etc/ingress.yaml
    volumes:
      - ./backend/configs/ingress.yaml:/etc/ingress.yaml
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

volumes:
  redis-data:
    driver: local
