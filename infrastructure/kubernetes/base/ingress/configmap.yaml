apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-config
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/component: ingress-server
data:
  ingress.yaml: |
    log_level: info
    api_key: ""
    api_secret: ""
    ws_url: ""
    redis:
      address: redis:6379
    whip_port: 8080
    rtmp_port: 1935
    health_port: 8090
    prometheus_port: 9092
