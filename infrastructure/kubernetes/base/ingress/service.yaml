apiVersion: v1
kind: Service
metadata:
  name: ingress
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/component: ingress-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingress
  ports:
    - name: whip
      port: 8080
      targetPort: whip
      protocol: TCP
    - name: rtmp
      port: 1935
      targetPort: rtmp
      protocol: TCP
    - name: health
      port: 8090
      targetPort: health
      protocol: TCP
