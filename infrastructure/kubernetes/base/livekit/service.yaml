apiVersion: v1
kind: Service
metadata:
  name: livekit
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/component: sfu
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: http
      port: 7880
      targetPort: http
      protocol: TCP
    - name: rtc-tcp
      port: 7881
      targetPort: rtc-tcp
      protocol: TCP
