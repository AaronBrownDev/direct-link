apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap-datasource.yaml
  - configmap-dashboard-provider.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml

configMapGenerator:
  - name: grafana-dashboard-signaling-overview
    options:
      disableNameSuffixHash: true
    files:
      - signaling-overview.json=dashboards/signaling-overview.json