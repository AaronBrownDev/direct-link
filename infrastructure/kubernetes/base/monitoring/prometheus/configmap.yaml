apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "signaling-server"
        static_configs:
          - targets: ["signaling:8081"]
            labels:
              service: "signaling"
              environment: "dev"
        metrics_path: "/metrics"
        scrape_interval: 5s

      - job_name: "livekit-server"
        static_configs:
          - targets: ["livekit:9091"]
            labels:
              service: "livekit"
              environment: "dev"
        metrics_path: "/metrics"
        scrape_interval: 5s

      - job_name: "ingress-server"
        static_configs:
          - targets: ["ingress:9092"]
            labels:
              service: "ingress"
              environment: "dev"
        metrics_path: "/metrics"
        scrape_interval: 5s