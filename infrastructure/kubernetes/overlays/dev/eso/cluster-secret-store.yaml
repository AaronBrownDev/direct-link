apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: directlink-dev
      auth:
        workloadIdentity:
          # The GCP service account ESO uses to access Secret Manager.
          # Bound to the ESO K8s service account via Workload Identity
          # during cluster setup.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
          clusterLocation: us-south1-a
          clusterName: directlink-dev