apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: directlink-secret
  namespace: directlink-dev
spec:
  # How often ESO re-syncs from Secret Manager.
  # If the K8s Secret is deleted, ESO recreates it within this interval.
  refreshInterval: 1h

  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore

  target:
    name: directlink-secret
    creationPolicy: Owner  # ESO owns this Secret — deleting the ExternalSecret deletes the Secret

  data:
    - secretKey: LIVEKIT_API_KEY
      remoteRef:
        key: directlink-livekit-api-key   # Secret Manager secret name
    - secretKey: LIVEKIT_API_SECRET
      remoteRef:
        key: directlink-livekit-api-secret  # Secret Manager secret name
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: directlink-redis-password      # Secret Manager secret name