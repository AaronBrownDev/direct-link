apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
data:
  livekit.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 60000
      use_ice_lite: true
      node_ip: REPLACE_NODE_IP
      use_external_ip: true
    prometheus_port: 9091
    redis:
      address: redis.directlink-dev.svc.cluster.local:6379
    keys:
      devkey: REPLACE_DEV_SECRET
    webhook:
      api_key: devkey
      urls:
        - http://signaling.directlink-dev.svc.cluster.local:8081/webhooks/livekit
    ingress:
      whip_base_url: http://REPLACE_NODE_IP:8080/whip