syntax = "proto3";

package directlink.signaling;

// Go package path for generated code
option go_package = "github.com/AaronBrownDev/direct-link/shared/protocol/signaling";

// SignalingService handles session access and production control
service SignalingService {
    // JoinSession authenticates a user and returns a LiveKit token for direct media connection
    rpc JoinSession(JoinRequest) returns (JoinReply);
    // CreateSession creates a new production session and returns a room code
    rpc CreateSession(CreateSessionRequest) returns (CreateSessionReply);
    // CloseSession closes a active session, only the owner can do this
    rpc CloseSession(CloseSessionRequest) returns (CloseSessionReply);
    // GetMySessions returns all sessions creates by the requesting user
    rpc GetMySessions(GetMySessionsRequest) returns (GetMySessionsReply);
    // GetServerTime returns the server time in nanoseconds
    rpc GetServerTime(GetServerTimeRequest) returns (GetServerTimeReply);
}

// JoinRequest initiates joining a session
message JoinRequest {
    string room_code =1; // Room/session to join
    string user_id = 2; // Unique identifier for who is requesting
    string role = 3; // "camera" or "director"
}

// JoinReply provides credentials for connecting to LiveKit
message JoinReply {
    string token = 1;       // LiveKit JWT access token (directors only)
    string livekit_url = 2; // LiveKit server URL (directors for media; cameras for data channel)
    string whip_url = 3;    // WHIP endpoint (cameras only)
    string stream_key = 4;  // WHIP auth token / stream key (cameras only)
    string data_token = 5;  // LiveKit data-only JWT for camera latency measurement (cameras only)
}

// CreatesSessionRequest initiates creation of a new production session 
message CreateSessionRequest{
    string user_id = 1; // the director creating the session
    int32 max_cameras = 2; // Maximum number of camera operators allowed
}

// CreateSession Reply returns the identifiers for the newly created session
message CreateSessionReply{
    string room_code = 1; // Human-readable code to share with camera operators
}

// CloseSessionRequest closes an active session
message CloseSessionRequest{
    string room_code = 1; // Room to to close
    string user_id = 2; // Must match the session owner
}

//CloseSessionReply confirms the session was closed 
message CloseSessionReply{
    bool success =1;
}

// GetMySessionsRequest fetched all sessions for a user
message GetMySessionsRequest{
    string user_id = 1; // The director whose sessions to fetch
}

// GetMySessionsReply returns a list of the user's sessions
message GetMySessionsReply{
    repeated SessionInfo sessions = 1;
}

// SessionInfo represents a single session in a list response
message SessionInfo{
    string session_id = 1; // Internal UUID, informational only
    string room_code = 2; // Primary identifier
    string status = 3; // "active" or "closed"
    int32 max_cameras = 4; // Max cameras allowed
    string created_at = 5; // RFC3339 formatted timestamp
}

// GetServerTimeRequest is an empty request
message GetServerTimeRequest {}

// GetServerTimeReply returns the server's current wall clock time for client clock offset calculation 
message GetServerTimeReply {
    int64 server_time_ns = 1; // Current server time as Unix timestamp in nanoseconds
}
